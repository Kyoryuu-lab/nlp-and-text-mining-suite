<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>NLP Summarizer Portal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body p-4 bg-primary text-white rounded">
            <h1 class="h3 mb-1">Automatische Textzusammenfassung (Extractive Summarization)</h1>
            <p class="mb-0 text-white-50">LSA- und TextRank-Algorithmen mit Sumy Engine</p>
        </div>
    </div>

    <form method="POST">
        <div class="mb-3">
            <label class="form-label fw-bold">Eingabetext:</label>
            <textarea name="text" rows="8" class="form-control" placeholder="Geben Sie hier den auszuwertenden Text ein...">{{ original_text }}</textarea>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-md-6">
                <label class="form-label fw-bold">Methode:</label>
                <select name="method" class="form-select">
                    <option value="lsa" {% if method == 'lsa' %}selected{% endif %}>Latent Semantic Analysis (LSA)</option>
                    <option value="textrank" {% if method == 'textrank' %}selected{% endif %}>TextRank (Graphenbasiert)</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label fw-bold">Anzahl Zielsätze:</label>
                <input type="number" name="sentences" class="form-control" value="3" min="1" max="10">
            </div>
        </div>

        <button type="submit" class="btn btn-primary px-4">Zusammenfassung generieren</button>
    </form>

    {% if summary %}
    <div class="card shadow-sm mt-5 border-success">
        <div class="card-header bg-success text-white fw-bold">Extrahierte Kernaussagen:</div>
        <div class="card-body">
            <p class="card-text lead">{{ summary }}</p>
        </div>
    </div>
    {% endif %}
</div>
</body>
</html>
